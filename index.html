<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5YXHENQC97"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-5YXHENQC97');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<title>CINElzFlix | Stream Movies, TV Shows & Anime in HD</title>
<meta name="description" content="Stream trending movies, TV shows, and anime in HD. No sign-up required. Explore CINElzFlix now!">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://cinelzflix.com/">

<!-- Open Graph -->
<meta property="og:title" content="CINElzFlix | Stream Movies Online">
<meta property="og:description" content="Watch trending movies, TV shows, and anime in HD.">
<meta property="og:image" content="https://cinelzflix.com/logo.png">
<meta property="og:url" content="https://cinelzflix.com/">
<meta property="og:type" content="website">

<!-- Icons -->
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css?v=2.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

<!-- Structured Data -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "WebSite",
 "name": "CINElzFlix",
 "url": "https://cinelzflix.com/"
}
</script>

</head>

<body>

<!-- NAV -->
<nav id="navbar">
  <div class="logo">
    <a href="/">
      <img src="logo.png" alt="CINElzFlix - Watch Movies Online" id="site-logo">
    </a>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search movies..." />
  </div>
</nav>

<!-- HERO -->
<section id="hero-slider-container">
  <div id="hero-slider"></div>
</section>

<!-- GENRES -->
<div class="genre-container">
  <button data-genre="all">All</button>
  <button data-genre="28">Action</button>
  <button data-genre="35">Comedy</button>
  <button data-genre="27">Horror</button>
  <button data-genre="878">Sci-Fi</button>
</div>

<!-- MOVIES -->
<section class="category-section">
  <h2>Trending Movies</h2>
  <div id="movies-list" class="movie-row"></div>
</section>

<section class="category-section">
  <h2>TV Shows</h2>
  <div id="tvshows-list" class="movie-row"></div>
</section>

<section class="category-section">
  <h2>Anime</h2>
  <div id="anime-list" class="movie-row"></div>
</section>

<!-- LOADING (NEW) -->
<div id="loading" style="text-align:center; display:none;">
  <p>Loading content...</p>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>

  <div class="modal-content">
    <iframe id="modal-video" allowfullscreen></iframe>

    <div class="modal-details">
      <img id="modal-image" alt="Movie Poster">
      <h2 id="modal-title"></h2>
      <p id="modal-description"></p>

      <select id="server">
        <option value="vidsrc">Server 1</option>
        <option value="vidsrc2">Server 2</option>
        <option value="videasy">Server 3</option>
      </select>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2026 CINElzFlix</p>
</footer>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>
/* FIXED EVENT SYSTEM (NO INLINE JS) */

// Genre filter
document.querySelectorAll('[data-genre]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterGenre(btn.dataset.genre);
  });
});

// Search
document.getElementById('search-input').addEventListener('input',(e)=>{
  handleSearch(e.target.value);
});

// Server change
document.getElementById('server').addEventListener('change',changeServer);

</script>

</body>
</html>
